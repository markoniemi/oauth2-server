name: Maven Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # ubuntu-latest has a Docker daemon; jib dockerBuild and Testcontainers both use /var/run/docker.sock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>repsy</id>
                <username>\${env.MAVEN_USERNAME}</username>
                <password>\${env.MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Run every module's tests before anything is published: in one reactor run, auth-server
      # would deploy and push its image before the auth-server-testcontainers ITs run
      - name: Build and test
        run: mvn -B install -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Publish artifacts and image
        if: github.event_name == 'push'
        run: mvn -B -Pci deploy -DskipTests -Djib.to.auth.username=${{ github.actor }} -Djib.to.auth.password=${{ secrets.PACKAGE_UPDATE_TOKEN }} -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        env:
          MAVEN_USERNAME: ${{ secrets.REPSY_USER }}
          MAVEN_PASSWORD: ${{ secrets.REPSY_TOKEN }}

      - name: Trigger dynamic-form build
        if: success() && github.event_name == 'push'
        run: |
          gh api repos/markoniemi/dynamic-form/dispatches \
            --input - <<'EOF'
          {"event_type": "oauth2-server-built", "client_payload": {}}
          EOF
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

