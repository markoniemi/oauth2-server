app:
  security:
    users:
      - username: admin
        password: admin
        roles:
          - USER
          - ADMIN

spring:
  security:
    oauth2:
      authorizationserver:
        client:
          frontend-client:
            registration:
              client-id: frontend-client
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
              redirect-uris:
                - http://localhost:5173
              post-logout-redirect-uris:
                - http://localhost:5173
              scopes:
                - openid
                - profile
                - email
            require-proof-key: true
