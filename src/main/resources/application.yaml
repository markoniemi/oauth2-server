spring:
  application:
    name: auth-server
  config:
    import: optional:classpath:/config/application.yaml,optional:classpath:/clients.yaml
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000

server:
  port: 9000
  servlet:
    context-path: /

app:
  security:
    users:
      - username: admin
        password: 'admin'
        roles:
          - USER
          - ADMIN
      - username: user
        password: 'user'
        roles:
          - USER
