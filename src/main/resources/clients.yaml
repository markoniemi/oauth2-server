app:
  oauth2:
    clients:
      - client-id: frontend-client
        client-secret: null
        client-authentication-method: NONE
        authorization-grant-types:
          - AUTHORIZATION_CODE
        redirect-uris:
          - http://localhost:8080
          - http://localhost:5173
        post-logout-redirect-uris:
          - http://localhost:5173
          - http://localhost:8080
        scopes:
          - openid
          - profile
          - email
        require-proof-key: true
        access-token-time-to-live: 3600
        refresh-token-time-to-live: 604800
