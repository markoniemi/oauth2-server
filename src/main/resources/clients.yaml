app:
  oauth2:
    clients:
      - clientId: frontend-client
        clientSecret: null
        clientAuthenticationMethod: NONE
        authorizationGrantTypes:
          - AUTHORIZATION_CODE
        redirectUris:
          - http://localhost:8080
          - http://localhost:5173
        postLogoutRedirectUris:
          - http://localhost:5173
          - http://localhost:8080
        scopes:
          - openid
          - profile
          - email
        requireProofKey: true
        accessTokenTimeToLive: 3600
        refreshTokenTimeToLive: 604800
